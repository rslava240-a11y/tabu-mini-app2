      const [quickNote, setQuickNote] = useState('');

      const normalizedQuery = normalizePhone(query);

      const matches = useMemo(() => {
        if (!normalizedQuery && !query.trim()) return [];
        const qLower = query.trim().toLowerCase();
        return blacklist.filter((item) => {
          const itemDigits = normalizePhone(item.phone);
          const phoneMatch = normalizedQuery ? itemDigits.includes(normalizedQuery) : false;
          const textMatch =
            item.phone.toLowerCase().includes(qLower) ||
            item.reason.toLowerCase().includes(qLower) ||
            item.tag.toLowerCase().includes(qLower);
          return phoneMatch || textMatch;
        });
      }, [blacklist, query, normalizedQuery]);

      const hasInput = query.trim().length > 0;
      const isFound = matches.length > 0;
      const activeModelsCount = models.filter((m) => m.status === 'Активна').length;

        e.preventDefault();
        if (!query.trim()) return;
        onRunCreation('ЗАПИСЬ В ЧС', `Добавляем ${query.trim()} в базу...`, () => {
          onQuickAddBlacklist({
            phone: query.trim(),

            reason: quickNote.trim() || 'Добавлено через быструю проверку на смене',

    // =========================================================================
    // 5. МОДУЛЬ 2: ЧС НОМЕРА (БАЗА И ДОБАВЛЕНИЕ)
    // =========================================================================
    function BlacklistView({ blacklist, onAdd, onDelete, onCopy, onRunCreation }) {
      const [search, setSearch] = useState('');
      const [tagFilter, setTagFilter] = useState('Все');
      const [phone, setPhone] = useState('');
      const [tag, setTag] = useState('Неадекват');
      const [reason, setReason] = useState('');
      const [addedBy, setAddedBy] = useState('Eva');

      const tags = ['Все', 'Неадекват', 'Фейк', 'Точечный ЧС', 'Опасно', 'ЧС'];

      const filteredList = useMemo(() => {
        const digits = normalizePhone(search);
        const lower = search.trim().toLowerCase();
        return blacklist.filter((item) => {
          const tagOk = tagFilter === 'Все' || item.tag === tagFilter;
          if (!tagOk) return false;
          if (!search.trim()) return true;
          return (
            (digits && normalizePhone(item.phone).includes(digits)) ||
            item.phone.toLowerCase().includes(lower) ||
            item.reason.toLowerCase().includes(lower) ||
            item.addedBy.toLowerCase().includes(lower)
          );
        });
      }, [blacklist, search, tagFilter]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!phone.trim() || !reason.trim()) return;
        onRunCreation('ДОБАВЛЕНИЕ В ЧС', `Сохраняем номер ${phone.trim()}...`, () => {
          onAdd({
            phone: phone.trim(),
            reason: reason.trim(),
            tag,
            addedBy: addedBy.trim() || 'Оператор TAB',
            date: todayFormatted()
          });
          setPhone('');
          setReason('');
        });
      };

      return h('div', { className: 'space-y-6' },
        h('section', { className: 'glass-panel rounded-[8px] p-5' },
          h('h2', { className: 'font-brand-brush text-base sm:text-lg text-white uppercase mb-4' }, 'ВНЕСТИ НОМЕР В ЧЁРНЫЙ СПИСОК'),
          h('form', { onSubmit: handleSubmit, className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Номер телефона'),
              h('input', {
                type: 'text',
                required: true,
                value: phone,
                onChange: (e) => setPhone(e.target.value),
                placeholder: '+995 5XX XX XX XX',
                className: 'glass-field wavy-contour w-full px-3.5 py-2.5 text-sm text-white placeholder-zinc-400 outline-none'
              })
            ),
            h('div', { className: 'grid grid-cols-2 gap-2' },
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Метка'),
                h('select', {
                  value: tag,
                  onChange: (e) => setTag(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2.5 text-sm text-white outline-none'
                },
                  h('option', { value: 'Неадекват' }, 'Неадекват'),
                  h('option', { value: 'Фейк' }, 'Фейк'),
                  h('option', { value: 'Точечный ЧС' }, 'Точечный ЧС'),
                  h('option', { value: 'Опасно' }, 'Опасно'),
                  h('option', { value: 'ЧС' }, 'ЧС')
                )
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Кто добавил'),
                h('input', {
                  type: 'text',
                  value: addedBy,
                  onChange: (e) => setAddedBy(e.target.value),
                  placeholder: 'Имя / смена',
                  className: 'glass-field wavy-contour w-full px-3 py-2.5 text-sm text-white placeholder-zinc-400 outline-none'
                })
              )
            ),
            h('div', { className: 'sm:col-span-2' },
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Причина и детали инцидента'),
              h('textarea', {
                rows: '2',
                required: true,
                value: reason,
                onChange: (e) => setReason(e.target.value),
                placeholder: 'К кому не пускать, фейк оплата/крипта/выезд, детали...',
                className: 'glass-field wavy-contour w-full px-3.5 py-2.5 text-sm text-white placeholder-zinc-400 outline-none'
              })
            ),
            h('div', { className: 'sm:col-span-2 flex justify-end' },
              h('button', {
                type: 'submit',
                className: 'btn-press w-full sm:w-auto px-5 py-2.5 rounded-[8px] bg-crimson-700 hover:bg-crimson-600 text-white text-sm font-semibold'
              }, 'Сохранить в ЧС')
            )
          )
        ),

        h('section', { className: 'space-y-3' },
          h('div', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-3' },
            h('input', {
              type: 'text',
              value: search,
              onChange: (e) => setSearch(e.target.value),
              placeholder: `Поиск среди ${blacklist.length} записей по номеру, имени модели или автору...`,
              className: 'glass-panel wavy-contour w-full sm:max-w-md px-3.5 py-2 text-sm text-white placeholder-zinc-400 outline-none'
            }),
            h('div', { className: 'flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1' },
              tags.map((t) =>
                h('button', {
                  key: t,
                  type: 'button',
                  onClick: () => setTagFilter(t),
                  className: `btn-press px-3 py-1.5 rounded-[8px] text-xs font-medium whitespace-nowrap border ${
                    tagFilter === t
                      ? 'bg-crimson-700 border-crimson-600 text-white'
                      : 'glass-panel text-zinc-400 hover:text-white'
                  }`
                }, t)
              )
            )
          ),

          filteredList.length === 0
            ? h('div', { className: 'glass-panel rounded-[8px] p-8 text-center text-sm text-zinc-400' },
                'Записей по заданному фильтру нет.'
              )
            : h('div', { className: 'space-y-2.5' },
                filteredList.map((item) =>
                  h('div', {
                    key: item.id,
                    className: 'glass-panel rounded-[8px] p-4 flex flex-col sm:flex-row sm:items-start justify-between gap-3'
                  },
                    h('div', { className: 'space-y-1.5 min-w-0' },
                      h('div', { className: 'flex flex-wrap items-center gap-2' },
                        h('span', { className: 'text-sm sm:text-base font-bold text-white' }, formatPhoneDisplay(item.phone)),
                        h('span', { className: 'px-2 py-0.5 text-[11px] font-semibold rounded-[6px] bg-crimson-900/60 text-crimson-500 border border-crimson-700/60' }, item.tag),
                        h('span', { className: 'text-xs text-zinc-500' }, `${item.date} • ${item.addedBy}`)
                      ),
                      h('p', { className: 'text-sm text-zinc-200 leading-relaxed' }, item.reason)
                    ),
                    h('div', { className: 'flex items-center gap-2 shrink-0 self-end sm:self-start' },
                      h('button', {
                        type: 'button',
                        onClick: () => onCopy(formatPhoneDisplay(item.phone), 'Номер скопирован'),
                        className: 'btn-press glass-field px-2.5 py-1.5 rounded-[8px] hover:border-zinc-500 text-xs text-zinc-200'
                      }, 'Копировать'),
                      h('button', {
                        type: 'button',
                        onClick: () => onDelete(item.id),
                        className: 'btn-press glass-field px-2.5 py-1.5 rounded-[8px] hover:border-crimson-600 text-xs text-zinc-400 hover:text-crimson-500'
                      }, 'Удалить')
                    )
                  )
                )
              )
        )
      );
    }

    // =========================================================================
    // 6. МОДУЛЬ 3: МОДЕЛИ И КАРТОЧКИ ДЛЯ КЛИЕНТА
    // =========================================================================
    function ModelsView({ models, onAddModel, onUpdateModel, onDeleteModel, onCopy, onRunCreation }) {
      const [selectedId, setSelectedId] = useState(models[0]?.id || null);
      const [showAddForm, setShowAddForm] = useState(false);
      const [newModel, setNewModel] = useState({
        name: '',
        age: '20',
        height: '170',
        weight: '52',
        bust: '—',
        status: 'Активна',
        incall: '30 мин — 500 GEL / 1 ч — 700 GEL',
        outcall: '1 ч — 1000 GEL / 2 ч — 1500 GEL / 3 ч — 3000 GEL',
        fullNight: 'По договорённости',
        services: 'Массаж, минет без резинки, секс, GFE',
        extras: '',
        address: 'Тбилиси',
        intercom: '',
        mapUrl: '',
        internalNote: '',
        photoDataUrl: ''
      });

      const selectedModel = useMemo(
        () => models.find((m) => m.id === selectedId) || models[0] || null,
        [models, selectedId]
      );

      const handlePhotoUpload = (e, targetMode) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result || '');
          if (targetMode === 'new') {
            setNewModel((prev) => ({ ...prev, photoDataUrl: dataUrl }));
          } else if (selectedModel) {
            onUpdateModel({ ...selectedModel, photoDataUrl: dataUrl });
          }
        };
        reader.readAsDataURL(file);
      };

      const handleDownloadPhoto = (model) => {
        if (!model || !model.photoDataUrl) return;
        const link = document.createElement('a');
        link.href = model.photoDataUrl;
        link.download = `${model.name || 'model'}-photo.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const buildClientCardText = (m) => {
        return [
          `${m.name}, ${m.age} лет`,
          `Рост / вес${m.bust && m.bust !== '—' ? ' / грудь' : ''}: ${m.height} см / ${m.weight} кг${m.bust && m.bust !== '—' ? ` / ${m.bust}` : ''}`,
          `Incall: ${m.incall}`,
          `Outcall: ${m.outcall}`,
          m.fullNight && m.fullNight !== 'По договорённости' ? `Ночь: ${m.fullNight}` : null,
          `В встречу входит: ${m.services}`,
          m.extras ? `Допы: ${m.extras}` : null,
          `Адрес: ${m.address}`,
          m.mapUrl ? `Локация: ${m.mapUrl}` : null
        ]
          .filter(Boolean)
          .join('\n');
      };

      const handleCreateModel = (e) => {
        e.preventDefault();
        if (!newModel.name.trim()) return;
        const created = {
          ...newModel,
          id: `m-${Date.now()}`,
          age: Number(newModel.age) || 20,
          height: Number(newModel.height) || 170,
          weight: Number(newModel.weight) || 52
        };
        onRunCreation('СОЗДАНИЕ АНКЕТЫ', `Собираем карточку ${created.name}...`, () => {
          onAddModel(created);
          setSelectedId(created.id);
          setShowAddForm(false);
          setNewModel({
            name: '',
            age: '20',
            height: '170',
            weight: '52',
            bust: '—',
            status: 'Активна',
            incall: '30 мин — 500 GEL / 1 ч — 700 GEL',
            outcall: '1 ч — 1000 GEL / 2 ч — 1500 GEL / 3 ч — 3000 GEL',
            fullNight: 'По договорённости',
            services: 'Массаж, минет без резинки, секс, GFE',
            extras: '',
            address: 'Тбилиси',
            intercom: '',
            mapUrl: '',
            internalNote: '',
            photoDataUrl: ''
          });
        });
      };

      return h('div', { className: 'space-y-6' },
        h('div', { className: 'flex flex-wrap items-center justify-between gap-3' },
          h('div', { className: 'flex items-center gap-2 overflow-x-auto no-scrollbar py-1' },
            models.map((m) => {
              const active = selectedModel && selectedModel.id === m.id;
              return h('button', {
                key: m.id,
                type: 'button',
                onClick: () => {
                  setSelectedId(m.id);
                  setShowAddForm(false);
                },
                className: `btn-press px-3.5 py-2 rounded-[8px] text-xs sm:text-sm font-semibold whitespace-nowrap border flex items-center gap-2 ${
                  active
                    ? 'bg-crimson-700 border-crimson-600 text-white'
                    : 'glass-panel text-zinc-300 hover:text-white'
                }`

    // 8. МОДУЛЬ 5: БУХГАЛТЕРИЯ, ОТЧЁТЫ ЗА СМЕНУ, ПРАВИЛА И ШТРАФЫ
    // =========================================================================
    function AccountingView({ bookings, shiftReports, onAddBooking, onAddShiftReport, onCopy, onRunCreation }) {
      const [subTab, setSubTab] = useState('rules');

      const [bDate, setBDate] = useState(todayFormatted());
      const [bModel, setBModel] = useState('Мила / Mila');
      const [bDuration, setBDuration] = useState('1 час');
      const [bPrice, setBPrice] = useState('700 GEL');
      const [bOperator, setBOperator] = useState('Eva');
      const [bTime, setBTime] = useState('18:00');
      const [bClientPhone, setBClientPhone] = useState('+995 ');
      const [bReview, setBReview] = useState('');
      const [bAddress, setBAddress] = useState('57 Beri Gabriel Salosi Avenue');

      const generatedBookingText = useMemo(() => {
        return [
          `Дата: ${bDate}`,
          `Модель: ${bModel}`,
          `Время / длительность: ${bTime} (${bDuration})`,
          `Оплата: ${bPrice}`,
          `Оператор: ${bOperator}`,
          bClientPhone.trim() && bClientPhone.trim() !== '+995' ? `Номер клиента: ${bClientPhone.trim()}` : null,
          bAddress.trim() ? `Адрес: ${bAddress.trim()}` : null,
          bReview.trim() ? `Детали / заметка: ${bReview.trim()}` : null
        ]
          .filter(Boolean)
          .join('\n');
      }, [bDate, bModel, bDuration, bPrice, bOperator, bTime, bClientPhone, bAddress, bReview]);

      const handleSaveBooking = (e) => {
        e.preventDefault();
        if (!bModel.trim()) return;
        const parsedNum = Number(String(bPrice).replace(/[^\d]/g, '')) || 0;
        const record = {
          id: `bk-${Date.now()}`,
          date: bDate.trim() || todayFormatted(),
          model: bModel.trim(),
          duration: bDuration.trim(),
          priceText: bPrice.trim(),
          amountNum: parsedNum,
          operator: bOperator.trim(),
          timeSlot: bTime.trim(),
          clientPhone: bClientPhone.trim(),
          review: bReview.trim(),
          address: bAddress.trim()
        };
        onRunCreation('ЗАПИСЬ В КАССУ', `Фиксируем запись по модели ${record.model}...`, () => {
          onAddBooking(record);
          onCopy(generatedBookingText, 'Карточка бухгалтерии сохранена и скопирована');
        });
      };

      const [sDate, setSDate] = useState(todayFormatted());
      const [sMessages, setSMessages] = useState('0');
      const [sOrdersCount, setSOrdersCount] = useState('0');
      const [sTotal, setSTotal] = useState('0 GEL');
      const [sNotes, setSNotes] = useState('');

      const buildShiftText = (rep) => {
        const dayOrders = bookings.filter((b) => b.date === rep.date);
        const ordersLines =
          dayOrders.length > 0
            ? dayOrders.map(
                (o, idx) =>
                  `${idx + 1}. ${o.model} (${o.duration}, ${o.timeSlot}) — ${o.priceText} [${o.operator}]`
              )
            : [`Заказов в журнале за ${rep.date}: ${rep.ordersCount}`];

        return [
          rep.date,
          `Кол-во соо: ${rep.messagesCount}`,
          `Заказы: ${rep.ordersCount}`,
          ...ordersLines,
          `Тотал: ${rep.totalText}`,
          rep.notes ? `Примечание: ${rep.notes}` : null
        ]
          .filter(Boolean)
          .join('\n');
      };

      const handleSaveShift = (e) => {
        e.preventDefault();
        const newRep = {
          id: `sh-${Date.now()}`,
          date: sDate.trim() || todayFormatted(),
          messagesCount: Number(sMessages) || 0,
          ordersCount: Number(sOrdersCount) || 0,
          totalText: sTotal.trim() || '0',
          notes: sNotes.trim()
        };
        onRunCreation('ОТЧЁТ ЗА СМЕНУ', `Собираем итоги за ${newRep.date}...`, () => {
          onAddShiftReport(newRep);
          onCopy(buildShiftText(newRep), 'Отчёт за смену сохранён и скопирован');
          setSNotes('');
        });
      };

      return h('div', { className: 'space-y-6' },
        h('div', { className: 'flex items-center gap-2 overflow-x-auto no-scrollbar pb-1' },
          [
            { id: 'rules', label: 'Правила и штрафы' },
            { id: 'booking', label: 'Бухгалтерия (запись)' },
            { id: 'shift', label: 'Отчёты за смену' }
          ].map((tab) =>
            h('button', {
              key: tab.id,
              type: 'button',
              onClick: () => setSubTab(tab.id),
              className: `btn-press px-4 py-2 rounded-[8px] text-xs sm:text-sm font-semibold whitespace-nowrap border ${
                subTab === tab.id
                  ? 'bg-crimson-700 border-crimson-600 text-white'
                  : 'glass-panel text-zinc-400 hover:text-white'
              }`
            }, tab.label)
          )
        ),

        subTab === 'rules' && h('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' },
          h('section', { className: 'glass-panel rounded-[8px] p-5 space-y-3' },
            h('h2', { className: 'font-brand-brush text-base text-white uppercase' }, 'ПРАВИЛА РАБОТЫ (TABU)'),
            h('div', { className: 'space-y-3' },
              INITIAL_RULES.map((rule, idx) =>
                h('div', {
                  key: rule.id,
                  className: 'glass-field rounded-[8px] p-3.5 space-y-1'
                },
                  h('p', { className: 'text-sm font-bold text-white' }, `${idx + 1}. ${rule.title}`),
                  h('p', { className: 'text-xs sm:text-sm text-zinc-300 leading-relaxed' }, rule.body)
                )
              )
            )
          ),

          h('section', { className: 'glass-panel rounded-[8px] p-5 space-y-3' },
            h('h2', { className: 'font-brand-brush text-base text-crimson-500 uppercase' }, 'ШТРАФЫ (TABU)'),
            h('div', { className: 'space-y-2' },
              INITIAL_FINES.map((fine) =>
                h('div', {
                  key: fine.id,
                  className: 'glass-field rounded-[8px] p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2'
                },
                  h('p', { className: 'text-xs sm:text-sm text-zinc-200' }, fine.violation),
                  h('span', { className: 'px-2.5 py-1 rounded-[6px] bg-crimson-900/50 border border-crimson-700/60 text-xs font-semibold text-white shrink-0 self-start sm:self-center' }, fine.penalty)
                )
              )
            )
          )
        ),

        subTab === 'booking' && h('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },
          h('form', {
            onSubmit: handleSaveBooking,
            className: 'glass-panel lg:col-span-7 rounded-[8px] p-5 space-y-3'
          },
            h('h2', { className: 'font-brand-brush text-base text-white uppercase mb-2' }, 'ЗАПИСЬ ВСТРЕЧИ / БУХГАЛТЕРИЯ'),
            h('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-3' },
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Дата'),
                h('input', {
                  type: 'text',
                  value: bDate,
                  onChange: (e) => setBDate(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
                })
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Имя модели'),
                h('input', {
                  type: 'text',
                  required: true,
                  value: bModel,
                  onChange: (e) => setBModel(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
                })
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Время встречи'),
                h('input', {
                  type: 'text',
                  value: bTime,
                  onChange: (e) => setBTime(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
                })
              )
            ),
            h('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-3' },
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Продолжительность'),
                h('input', {
                  type: 'text',
                  value: bDuration,
                  onChange: (e) => setBDuration(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
                })
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Оплата (нал/перевод/крипта)'),
                h('input', {
                  type: 'text',
                  value: bPrice,
                  onChange: (e) => setBPrice(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
                })
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Оператор'),
                h('input', {
                  type: 'text',
                  value: bOperator,
                  onChange: (e) => setBOperator(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
                })
              )
            ),
            h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Номер клиента'),
                h('input', {
                  type: 'text',
                  value: bClientPhone,
                  onChange: (e) => setBClientPhone(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
                })
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Адрес / локация'),
                h('input', {
                  type: 'text',
                  value: bAddress,
                  onChange: (e) => setBAddress(e.target.value),
                  className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
                })
              )
            ),
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Язык, типажное фото, статус номера и заметки'),
              h('textarea', {
                rows: '2',
                value: bReview,
                onChange: (e) => setBReview(e.target.value),
                placeholder: 'Например: EN, типажное фото, номер чистый...',
                className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white placeholder-zinc-400 outline-none'
              })
            ),
            h('div', { className: 'flex flex-wrap gap-2.5 pt-1' },
              h('button', {
                type: 'submit',
                className: 'btn-press px-4 py-2.5 rounded-[8px] bg-crimson-700 hover:bg-crimson-600 text-white text-sm font-semibold'
              }, 'Сохранить и скопировать'),
              h('button', {
                type: 'button',
                onClick: () => onCopy(generatedBookingText, 'Карточка скопирована'),
                className: 'btn-press glass-field px-4 py-2.5 rounded-[8px] hover:border-zinc-500 text-sm text-zinc-200'
              }, 'Только копировать текст')
            )
          ),

          h('div', { className: 'lg:col-span-5 space-y-4' },
            h('div', { className: 'glass-panel rounded-[8px] p-5 space-y-3' },
              h('p', { className: 'text-xs uppercase tracking-wider text-zinc-400' }, 'Готовый текст для отправки менеджеру'),
              h('pre', { className: 'glass-field whitespace-pre-wrap font-sans text-xs sm:text-sm text-zinc-200 rounded-[8px] p-3.5 leading-relaxed' }, generatedBookingText)
            ),

            h('div', { className: 'glass-panel rounded-[8px] p-5 space-y-3' },
              h('div', { className: 'flex items-center justify-between' },
                h('h3', { className: 'text-sm font-bold text-white' }, 'Журнал записей'),
                h('span', { className: 'text-xs text-zinc-400' }, `${bookings.length} шт.`)
              ),
              bookings.length === 0
                ? h('p', { className: 'text-xs text-zinc-400 py-3' }, 'В выгрузке заменённые записи не добавлены — внесите текущую смену через форму слева.')
                : h('div', { className: 'space-y-2 max-h-64 overflow-y-auto pr-1' },
                    bookings.map((bk) =>
                      h('div', {
                        key: bk.id,
                        className: 'glass-field rounded-[8px] p-3 text-xs space-y-1'
                      },
                        h('div', { className: 'flex items-center justify-between font-semibold text-white' },
                          h('span', null, `${bk.date} • ${bk.model}`),
                          h('span', { className: 'text-crimson-500' }, bk.priceText)
                        ),
                        h('p', { className: 'text-zinc-400' }, `${bk.duration} • ${bk.timeSlot} • ${bk.operator}`),
                        bk.review && h('p', { className: 'text-zinc-300' }, bk.review)
                      )
                    )
                  )
            )
          )
        ),

        subTab === 'shift' && h('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },
          h('form', {
            onSubmit: handleSaveShift,
            className: 'glass-panel lg:col-span-6 rounded-[8px] p-5 space-y-3'
          },
            h('h2', { className: 'font-brand-brush text-base text-white uppercase mb-2' }, 'СФОРМИРОВАТЬ ОТЧЁТ ЗА СМЕНУ'),
            h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Дата смены'),
                h('input', {
                  type: 'text',
                  value: sDate,
                  onChange: (e) => setSDate(e.target.value),
                  className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white outline-none'
                })
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Кол-во соо'),
                h('input', {
                  type: 'number',
                  value: sMessages,
                  onChange: (e) => setSMessages(e.target.value),
                  className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white outline-none'
                })
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Заказы (количество)'),
                h('input', {
                  type: 'number',
                  value: sOrdersCount,
                  onChange: (e) => setSOrdersCount(e.target.value),
                  className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white outline-none'
                })
              ),
              h('div', null,
                h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Тотал'),
                h('input', {
                  type: 'text',
                  value: sTotal,
                  onChange: (e) => setSTotal(e.target.value),
                  className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white outline-none'
                })
              )
            ),
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Примечание по смене'),
              h('textarea', {
                rows: '2',
                value: sNotes,
                onChange: (e) => setSNotes(e.target.value),
                placeholder: 'Важные детали смены...',
                className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white placeholder-zinc-500 outline-none'
              })
            ),
            h('div', { className: 'pt-1' },
              h('button', {
                type: 'submit',
                className: 'btn-press px-4 py-2.5 rounded-[8px] bg-crimson-700 hover:bg-crimson-600 text-white text-sm font-semibold'
              }, 'Сохранить и скопировать отчёт')
            )
          ),

          h('div', { className: 'lg:col-span-6 space-y-3' },
            h('h3', { className: 'text-sm font-bold text-white' }, 'Сохранённые отчёты смен'),
            shiftReports.length === 0
              ? h('div', { className: 'glass-panel rounded-[8px] p-5 text-xs text-zinc-400' },
                  'Отчётов за смену пока нет — заполните форму слева, чтобы сохранить и скопировать итог.'
                )
              : shiftReports.map((rep) => {
                  const formatted = buildShiftText(rep);
                  return h('div', {
                    key: rep.id,
                    className: 'glass-panel rounded-[8px] p-4 space-y-2.5'
                  },
                    h('div', { className: 'flex items-center justify-between' },
                      h('span', { className: 'text-sm font-bold text-white' }, `Смена ${rep.date}`),
                      h('button', {
                        type: 'button',
                        onClick: () => onCopy(formatted, `Отчёт за ${rep.date} скопирован`),
                        className: 'btn-press glass-field px-3 py-1 rounded-[8px] hover:border-crimson-600 text-xs text-zinc-200'
                      }, 'Копировать отчёт')
                    ),
                    h('pre', { className: 'glass-field whitespace-pre-wrap font-sans text-xs text-zinc-300 rounded-[8px] p-3 leading-relaxed' }, formatted)
                  );
                })
          )
        )
      );
    }

    // =========================================================================
    // 9. КОРНЕВОЙ КОМПОНЕНТ ПРИЛОЖЕНИЯ
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [toastMessage, setToastMessage] = useState('');
      const [creationAnim, setCreationAnim] = useState(null);
      const logoInputRef = useRef(null);

      const [blacklist, setBlacklist] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.blacklist)) return parsed.blacklist;
          }
        } catch (e) {}
        return INITIAL_BLACKLIST;
      });

      const [models, setModels] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.models) && parsed.models.length > 0) return parsed.models;
          }
        } catch (e) {}
        return INITIAL_MODELS;
      });

      const [operators, setOperators] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.operators) && parsed.operators.length > 0) return parsed.operators;
          }
        } catch (e) {}
        return INITIAL_OPERATORS;
      });

      const [bookings, setBookings] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.bookings)) return parsed.bookings;
          }
        } catch (e) {}
        return INITIAL_BOOKINGS;
      });

      const [shiftReports, setShiftReports] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.shiftReports)) return parsed.shiftReports;
          }
        } catch (e) {}
        return INITIAL_SHIFT_REPORTS;
      });

      const [customLogo, setCustomLogo] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (typeof parsed.customLogo === 'string') return parsed.customLogo;
          }
        } catch (e) {}
        return '';
      });

      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              blacklist,
              models,
              operators,
              bookings,
              shiftReports,
              customLogo
            })
          );
        } catch (e) {
          console.warn('Не удалось сохранить состояние в localStorage:', e);
        }
      }, [blacklist, models, operators, bookings, shiftReports, customLogo]);

      const notify = (msg) => {
        setToastMessage(msg);
        window.clearTimeout(window.__tabToastTimer);
        window.__tabToastTimer = window.setTimeout(() => {
          setToastMessage('');
        }, 2300);
      };

      const runCreationSquare = (title, subtitle, callback) => {
        setCreationAnim({ title, subtitle });
        window.setTimeout(() => {
          try {
            if (typeof callback === 'function') callback();
          } finally {
            setCreationAnim(null);
          }
        }, 560);
      };

      const handleCopy = (text, label = 'Скопировано') => {
        copyToClipboard(text);
        notify(label);
      };

      const handleLogoFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setCustomLogo(String(reader.result || ''));
          notify('Фон и эмблема обновлены');
        };
        reader.readAsDataURL(file);
      };

      const handleAddBlacklist = (entry) => {
        setBlacklist((prev) => [{ ...entry, id: `bl-${Date.now()}` }, ...prev]);
        notify('Номер добавлен в ЧС');
      };

      const handleDeleteBlacklist = (id) => {
        setBlacklist((prev) => prev.filter((item) => item.id !== id));
        notify('Запись удалена из ЧС');
      };

      const handleAddModel = (model) => {
        setModels((prev) => [...prev, model]);
        notify(`Модель ${model.name} добавлена`);
      };

      const handleUpdateModel = (updated) => {
        setModels((prev) => prev.map((m) => (m.id === updated.id ? updated : m)));
      };

      const handleDeleteModel = (id) => {
        setModels((prev) => prev.filter((m) => m.id !== id));
        notify('Карточка модели удалена');
      };

      const handleAddOperator = (op) => {
        setOperators((prev) => [...prev, op]);
        notify('Номер добавлен');
      };

      const handleDeleteOperator = (id) => {
        setOperators((prev) => prev.filter((op) => op.id !== id));
        notify('Номер удалён');
      };

      const handleAddBooking = (bk) => {
        setBookings((prev) => [bk, ...prev]);
      };

      const handleAddShiftReport = (rep) => {
        setShiftReports((prev) => [rep, ...prev]);
      };

      const navItems = [
        { id: 'home', label: 'Проверка' },
        { id: 'blacklist', label: 'ЧС номера' },
        { id: 'models', label: 'Модели' },
        { id: 'operators', label: 'Команда' },
        { id: 'accounting', label: 'Регламент' }
      ];

      return h('div', { className: 'relative min-h-screen bg-obsidian text-zinc-100 flex flex-col' },
        h(AmbientBackdropPhoto, { customLogo }),
        h(CreationSquareModal, { creation: creationAnim }),
        h(ToastBanner, { message: toastMessage }),

        h('header', { className: 'sticky top-0 z-30 bg-obsidian/85 backdrop-blur-md border-b border-hairline' },
          h('div', { className: 'max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-3' },
            h('div', { className: 'flex items-center gap-3 min-w-0' },
              h('button', {
                type: 'button',
                onClick: () => setActiveTab('home'),
                className: 'btn-press shrink-0'
              }, h(TabBrandLogo, { customLogo })),
              h('span', { className: 'hidden sm:inline-block text-xs text-zinc-400 border-l border-hairline pl-3 truncate' },
                'TABU • Рабочее пространство смены'
              )
            ),

            h('nav', { className: 'hidden md:flex items-center gap-1' },
              navItems.map((item) =>
                h('button', {
                  key: item.id,
                  type: 'button',
                  onClick: () => setActiveTab(item.id),
                  className: `btn-press px-3 py-1.5 rounded-[8px] text-xs font-semibold transition ${
                    activeTab === item.id
                      ? 'bg-crimson-700 text-white'
                      : 'text-zinc-400 hover:text-white hover:bg-surface'
                  }`
                }, item.label)
              )
            ),

            h('div', { className: 'flex items-center gap-1.5 shrink-0' },
              h('button', {
                type: 'button',
                onClick: () => logoInputRef.current && logoInputRef.current.click(),
                className: 'btn-press px-2.5 py-1.5 rounded-[8px] bg-surface border border-hairline hover:border-crimson-600 text-[11px] text-zinc-300 hover:text-white'
              }, customLogo ? 'Сменить фон' : 'Свой фон'),
              customLogo && h('button', {
                type: 'button',
                onClick: () => {
                  setCustomLogo('');
                  notify('Возвращён фон TABU');
                },
                title: 'Сбросить свой фон',
                className: 'btn-press px-2 py-1.5 rounded-[8px] bg-surface border border-hairline hover:border-crimson-600 text-[11px] text-zinc-400 hover:text-white'
              }, '✕'),
              h('input', {
                ref: logoInputRef,
                type: 'file',
                accept: 'image/*',
                onChange: handleLogoFileChange,
                className: 'hidden'
              })
            )
          )
        ),

        h('main', { className: 'relative z-10 flex-1 max-w-6xl w-full mx-auto px-4 pt-5 pb-24 md:pb-10' },
          h('div', { key: activeTab, className: 'tab-stage-enter' },
            activeTab === 'home' && h(HomeView, {
              blacklist,
              models,
              operators,
              onNavigate: setActiveTab,
              onCopy: handleCopy,
              onQuickAddBlacklist: handleAddBlacklist,
              onRunCreation: runCreationSquare
            }),
            activeTab === 'blacklist' && h(BlacklistView, {
              blacklist,
              onAdd: handleAddBlacklist,
              onDelete: handleDeleteBlacklist,
              onCopy: handleCopy,
              onRunCreation: runCreationSquare
            }),
            activeTab === 'models' && h(ModelsView, {
              models,
              onAddModel: handleAddModel,
              onUpdateModel: handleUpdateModel,
              onDeleteModel: handleDeleteModel,
              onCopy: handleCopy,
              onRunCreation: runCreationSquare
            }),
            activeTab === 'operators' && h(OperatorsView, {
              operators,
              onAddOperator: handleAddOperator,
              onDeleteOperator: handleDeleteOperator,
              onCopy: handleCopy
            }),
            activeTab === 'accounting' && h(AccountingView, {
              bookings,
              shiftReports,
              onAddBooking: handleAddBooking,
              onAddShiftReport: handleAddShiftReport,
              onCopy: handleCopy,
              onRunCreation: runCreationSquare
            })
          )
        ),

        h('nav', { className: 'md:hidden fixed bottom-0 inset-x-0 z-30 bg-surface/90 backdrop-blur-md border-t border-hairline' },
          h('div', { className: 'grid grid-cols-5 px-1 py-1.5' },
            navItems.map((item) => {
              const active = activeTab === item.id;
              return h('button', {
                key: item.id,
                type: 'button',
                onClick: () => setActiveTab(item.id),
                className: `btn-press py-2 px-1 rounded-[8px] text-[11px] font-semibold truncate ${
                  active
                    ? 'bg-crimson-700 text-white'
                    : 'text-zinc-400 hover:text-white'
                }`
              }, item.label);
            })
          )
        )
      );
    }

    const rootEl = document.getElementById('root');
    ReactDOM.createRoot(rootEl).render(h(App));
  </script>
</body>
</html>
